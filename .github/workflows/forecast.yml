name: Rainfall forecast

on:
  schedule:
    # Daily, after the 00Z GFS run is complete. GitHub may delay or drop a scheduled run, so two
    # backups follow; a run that finds the forecast already published stops early.
    - cron: "17 5 * * *"
    - cron: "47 6 * * *"
    - cron: "17 9 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Run date YYYYMMDD (blank = latest published run)"
        required: false
      start_date:
        description: "First forecast day YYYYMMDD (blank = the run date)"
        required: false
      force:
        description: "Rebuild even if this run is already published"
        type: boolean
        default: false
      test_alert:
        description: "Send a test notification (phones with 'Test alerts' switched on)"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v5

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          cache-environment: true

      - name: Publish forecast
        env:
          FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          args=(--site site --restore-from "$SITE_URL")
          [ -n "${{ inputs.date }}" ] && args+=(--date "${{ inputs.date }}")
          [ -n "${{ inputs.start_date }}" ] && args+=(--start-date "${{ inputs.start_date }}")
          [ "${{ inputs.force }}" = "true" ] && args+=(--force)
          [ "${{ inputs.test_alert }}" = "true" ] && args+=(--test-alert)
          python -m somalia_rain_animation.publish "${args[@]}"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
